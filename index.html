<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPRIZE Tracker</title>
<style>
  :root {
    --bg: #0e0e13; --card: #17171f; --line: #262633; --text: #f2f2f6; --muted: #8b8b9c;
    --yt: #ff4d4d; --sp: #1ed760; --am: #ff5c8a; --accent: #9b8cff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f6fa; --card: #fff; --line: #e4e4ee; --text: #15151c; --muted: #6b6b7c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .updated { color: var(--muted); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card .label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .card .big { font-size: 28px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .delta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .up { color: var(--sp); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button, select { background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  select { border-radius: 8px; }
  svg { width: 100%; height: auto; display: block; }
  .empty { color: var(--muted); text-align: center; padding: 36px 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .scroll { overflow-x: auto; }
  tr:last-child td { border-bottom: 0; }
  .na { color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>UPRIZE <span>Tracker</span></h1>
    <div class="updated" id="updated"></div>
  </header>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <div class="controls">
      <button data-metric="youtube_views" class="on">YouTube</button>
      <button data-metric="spotify_streams">Spotify</button>
      <span style="flex:1"></span>
      <select id="trackSel"></select>
      <button data-mode="gain" class="on">Tăng mỗi ngày</button>
      <button data-mode="total">Tổng</button>
    </div>
    <div id="chart"></div>
  </section>

  <section class="panel scroll">
    <table id="table"></table>
  </section>

  <footer>
    Số liệu được ghi lại mỗi ngày. Lượt tăng mỗi ngày = chênh lệch giữa hai snapshot liên tiếp.
    Spotify không có API công khai cho số stream, nên số này được nhập tay và có thể thiếu.
  </footer>
</div>

<script>
const METRICS = {
  youtube_views: { name: "YouTube", color: "var(--yt)" },
  spotify_streams: { name: "Spotify", color: "var(--sp)" },
};
const fmt = n => n == null ? "–" : n.toLocaleString("vi-VN");
const fmtDelta = n => n == null ? "–" : (n >= 0 ? "+" : "") + n.toLocaleString("vi-VN");

let tracks = [], history = [];
let metric = "youtube_views", mode = "gain", sel = "all";

async function load() {
  try {
    const [t, h] = await Promise.all([
      fetch("tracks.json").then(r => r.json()),
      fetch("data/history.json").then(r => r.json()),
    ]);
    tracks = t.tracks; history = h;
  } catch (e) {
    document.getElementById("chart").innerHTML =
      '<div class="empty">Không tải được dữ liệu. Hãy mở trang qua máy chủ (ví dụ <code>python -m http.server</code>) thay vì mở file trực tiếp.</div>';
    return;
  }
  document.getElementById("updated").textContent = history.length
    ? "Cập nhật lần cuối: " + history[history.length - 1].date : "Chưa có dữ liệu";
  const s = document.getElementById("trackSel");
  s.innerHTML = '<option value="all">Tất cả bài</option>' +
    tracks.map(t => `<option value="${t.id}">${t.title}</option>`).join("");
  s.onchange = () => { sel = s.value; render(); };
  document.querySelectorAll("[data-metric]").forEach(b => b.onclick = () => {
    metric = b.dataset.metric; toggle("[data-metric]", b); render(); });
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    mode = b.dataset.mode; toggle("[data-mode]", b); render(); });
  render();
}
function toggle(q, btn) {
  document.querySelectorAll(q).forEach(b => b.classList.toggle("on", b === btn));
}

// chuỗi tổng theo ngày cho 1 metric, 1 bài hoặc tất cả
function series(m, id) {
  return history.map(h => {
    const ids = id === "all" ? Object.keys(h.tracks) : [id];
    let sum = 0, any = false;
    for (const k of ids) {
      const v = h.tracks[k] && h.tracks[k][m];
      if (v != null) { sum += v; any = true; }
    }
    return { date: h.date, v: any ? sum : null };
  });
}
function gains(s) {
  return s.map((p, i) => ({
    date: p.date,
    v: i > 0 && p.v != null && s[i - 1].v != null ? p.v - s[i - 1].v : null,
  }));
}
function latestDelta(m, id, days) {
  const s = series(m, id).filter(p => p.v != null);
  if (s.length < 2) return null;
  const last = s[s.length - 1];
  const prev = s[Math.max(0, s.length - 1 - days)];
  return last.v - prev.v;
}
function latest(m, id) {
  const s = series(m, id).filter(p => p.v != null);
  return s.length ? s[s.length - 1].v : null;
}

function renderCards() {
  document.getElementById("cards").innerHTML = Object.entries(METRICS).map(([m, info]) => {
    const d = latestDelta(m, "all", 1);
    return `<div class="card">
      <div class="label"><span class="dot" style="background:${info.color}"></span>${info.name}</div>
      <div class="big">${fmt(latest(m, "all"))}</div>
      <div class="delta"><span class="${d > 0 ? "up" : ""}">${fmtDelta(d)}</span> so với hôm qua</div>
    </div>`;
  }).join("");
}

function renderChart() {
  const el = document.getElementById("chart");
  const base = series(metric, sel);
  const pts = (mode === "gain" ? gains(base) : base).filter(p => p.v != null);
  if (pts.length < 1 || (mode === "gain" && pts.length < 1)) {
    el.innerHTML = '<div class="empty">Chưa đủ dữ liệu cho biểu đồ này. Cần ít nhất 2 ngày số liệu để tính lượt tăng.</div>';
    return;
  }
  const W = 800, H = 280, L = 60, R = 12, T = 12, B = 28;
  const max = Math.max(...pts.map(p => p.v), 1);
  const min = mode === "total" ? Math.min(...pts.map(p => p.v)) : 0;
  const span = (max - min) || 1;
  const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - min) / span);
  const color = METRICS[metric].color;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = min + span * i / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>
          <text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v).toLocaleString("vi-VN")}</text>`;
  }
  const step = Math.ceil(pts.length / 7);
  pts.forEach((p, i) => { if (i % step === 0)
    g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.date.slice(5)}</text>`; });
  if (mode === "gain") {
    const bw = Math.min(36, (W - L - R) / pts.length * .7);
    pts.forEach((p, i) => g += `<rect x="${x(i) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${y(0) - y(p.v)}" rx="3" fill="${color}"><title>${p.date}: ${fmtDelta(p.v)}</title></rect>`);
  } else {
    g += `<polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts.map((p, i) => x(i) + "," + y(p.v)).join(" ")}"/>`;
    pts.forEach((p, i) => g += `<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="${color}"><title>${p.date}: ${fmt(p.v)}</title></circle>`);
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ ${METRICS[metric].name}">${g}</svg>`;
}

function renderTable() {
  const head = `<tr><th>Bài hát</th>${Object.values(METRICS).map(m => `<th>${m.name}</th><th>+1 ngày</th>`).join("")}</tr>`;
  const rows = tracks.map(t => {
    const cells = Object.keys(METRICS).map(m => {
      const v = latest(m, t.id), d = latestDelta(m, t.id, 1);
      return `<td class="${v == null ? "na" : ""}">${fmt(v)}</td><td class="${d > 0 ? "up" : "na"}">${fmtDelta(d)}</td>`;
    }).join("");
    return `<tr><td>${t.title}</td>${cells}</tr>`;
  }).join("");
  document.getElementById("table").innerHTML = head + rows;
}

function render() { renderCards(); renderChart(); renderTable(); }
load();
</script>
</body>
</html>
