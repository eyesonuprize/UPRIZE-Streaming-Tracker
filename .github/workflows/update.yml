name: Cập nhật số liệu hằng ngày

on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy số liệu
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update.py
      - name: Commit dữ liệu mới
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "Cập nhật số liệu $(date -u +%F)"
          git push
